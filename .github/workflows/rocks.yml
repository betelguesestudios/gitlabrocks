name: Deploy Dynamic Contributors Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create service worker and pages
        run: |
          mkdir -p public
          
          # Service Worker
          cat > public/sw.js << 'SWEOF'
          const CACHE_NAME = 'gitlab-contributors-v2';

          self.addEventListener('install', (event) => {
              self.skipWaiting();
          });

          self.addEventListener('activate', (event) => {
              event.waitUntil(clients.claim());
          });

          async function getGravatarUrl(email, size = 80) {
              if (!email) return `https://www.gravatar.com/avatar/?d=identicon&s=${size}`;
              const clean = email.toLowerCase().trim();
              const encoder = new TextEncoder();
              const data = encoder.encode(clean);
              const hashBuffer = await crypto.subtle.digest('SHA-256', data);
              const hashArray = Array.from(new Uint8Array(hashBuffer));
              const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 32);
              return `https://www.gravatar.com/avatar/${hash}?d=identicon&s=${size}`;
          }

          async function loadImage(url) {
              const response = await fetch(url);
              if (!response.ok) throw new Error('Failed to load image');
              const blob = await response.blob();
              return await createImageBitmap(blob);
          }

          async function generatePNG(contributors) {
              const avatarSize = 80;
              const padding = 4;
              const cols = Math.min(10, contributors.length);
              const rows = Math.ceil(contributors.length / cols);
              
              const width = cols * (avatarSize + padding) + padding;
              const height = rows * (avatarSize + padding) + padding;
              
              const canvas = new OffscreenCanvas(width, height);
              const ctx = canvas.getContext('2d');
              
              ctx.clearRect(0, 0, width, height);
              
              for (let index = 0; index < contributors.length; index++) {
                  try {
                      const c = contributors[index];
                      const url = await getGravatarUrl(c.email, avatarSize);
                      const img = await loadImage(url);
                      
                      const col = index % cols;
                      const row = Math.floor(index / cols);
                      const x = padding + col * (avatarSize + padding);
                      const y = padding + row * (avatarSize + padding);
                      
                      ctx.save();
                      ctx.beginPath();
                      ctx.arc(x + avatarSize/2, y + avatarSize/2, avatarSize/2, 0, Math.PI * 2);
                      ctx.closePath();
                      ctx.clip();
                      ctx.drawImage(img, x, y, avatarSize, avatarSize);
                      ctx.restore();
                  } catch (e) {
                      console.error('Failed to load avatar:', e);
                  }
              }
              
              return await canvas.convertToBlob({ type: 'image/png' });
          }

          self.addEventListener('fetch', (event) => {
              const url = new URL(event.request.url);
              const path = url.pathname;
              
              // Only intercept .png requests
              if (path.endsWith('.png')) {
                  event.respondWith(
                      (async () => {
                          try {
                              // Remove .png extension first
                              let cleanPath = path.replace(/\.png$/, '');
                              // Remove leading slash and split
                              const parts = cleanPath.split('/').filter(p => p);
                              
                              console.log('Path parts:', parts);
                              
                              // Need at least: /github-repo/namespace/project
                              if (parts.length < 3) {
                                  return new Response('Invalid path. Use /username/repo.png', { 
                                      status: 400,
                                      headers: { 'Content-Type': 'text/plain' }
                                  });
                              }
                              
                              // parts[0] = GitHub repo name (e.g., "gitlabrocks")
                              // parts[1] = GitLab namespace (e.g., "walfie308")  
                              // parts[2] = GitLab project (e.g., "lint")
                              const namespace = parts[1];
                              const project = parts[2];
                              const repoPath = `${namespace}/${project}`;
                              
                              console.log('Fetching repo:', repoPath);
                              
                              // Check cache
                              const cache = await caches.open(CACHE_NAME);
                              const cached = await cache.match(event.request);
                              if (cached) return cached;
                              
                              // Fetch project from GitLab API
                              const encodedPath = encodeURIComponent(repoPath);
                              const projectUrl = `https://gitlab.com/api/v4/projects/${encodedPath}`;
                              console.log('API URL:', projectUrl);
                              
                              const projectRes = await fetch(projectUrl);
                              if (!projectRes.ok) {
                                  const errorText = await projectRes.text();
                                  console.error('Project not found:', projectRes.status, errorText);
                                  return new Response(`Project not found: ${repoPath}`, { 
                                      status: 404,
                                      headers: { 'Content-Type': 'text/plain' }
                                  });
                              }
                              
                              const projectData = await projectRes.json();
                              console.log('Project found:', projectData.path_with_namespace);
                              
                              // Fetch contributors
                              const contribUrl = `https://gitlab.com/api/v4/projects/${projectData.id}/repository/contributors`;
                              const contribRes = await fetch(contribUrl);
                              if (!contribRes.ok) {
                                  return new Response('Failed to fetch contributors', { 
                                      status: 500,
                                      headers: { 'Content-Type': 'text/plain' }
                                  });
                              }
                              
                              const contributors = await contribRes.json();
                              
                              if (!contributors || !contributors.length) {
                                  return new Response('No contributors found', { 
                                      status: 404,
                                      headers: { 'Content-Type': 'text/plain' }
                                  });
                              }
                              
                              console.log(`Generating PNG for ${contributors.length} contributors`);
                              
                              // Generate PNG
                              const pngBlob = await generatePNG(contributors);
                              
                              const response = new Response(pngBlob, {
                                  headers: {
                                      'Content-Type': 'image/png',
                                      'Cache-Control': 'public, max-age=3600',
                                      'Access-Control-Allow-Origin': '*'
                                  }
                              });
                              
                              // Cache the response
                              cache.put(event.request, response.clone());
                              
                              return response;
                              
                          } catch (error) {
                              console.error('Service worker error:', error);
                              return new Response('Error: ' + error.message, { 
                                  status: 500,
                                  headers: { 'Content-Type': 'text/plain' }
                              });
                          }
                      })()
                  );
              }
          });
          SWEOF

          # 404 page for non-PNG routes
          cat > public/404.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>GitLab Contributors</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container { max-width: 1200px; margin: 0 auto; }
                  h1 { color: white; text-align: center; font-size: 2.5em; margin-bottom: 30px; }
                  .content { background: white; border-radius: 15px; padding: 30px; }
                  .spinner {
                      border: 4px solid #f3f3f3; border-top: 4px solid #667eea;
                      border-radius: 50%; width: 40px; height: 40px;
                      animation: spin 1s linear infinite; margin: 20px auto;
                  }
                  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                  .contributors { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
                  .contributor { text-align: center; padding: 15px; border: 1px solid #eee; border-radius: 10px; }
                  .contributor img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; border: 3px solid #667eea; }
                  .error { color: #e74c3c; text-align: center; padding: 20px; display: none; }
                  #loading { text-align: center; padding: 40px; }
                  .png-link { display: inline-block; margin: 10px 0; padding: 10px 20px; background: #667eea; color: white; text-decoration: none; border-radius: 8px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>GitLab Contributors</h1>
                  <div class="content">
                      <div id="loading"><div class="spinner"></div><p>Loading...</p></div>
                      <div class="error" id="error"></div>
                      <div id="result"></div>
                  </div>
              </div>
              
              <script>
                  async function getGravatarUrl(email, size = 80) {
                      if (!email) return `https://www.gravatar.com/avatar/?d=identicon&s=${size}`;
                      const clean = email.toLowerCase().trim();
                      const encoder = new TextEncoder();
                      const data = encoder.encode(clean);
                      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                      const hashArray = Array.from(new Uint8Array(hashBuffer));
                      const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 32);
                      return `https://www.gravatar.com/avatar/${hash}?d=identicon&s=${size}`;
                  }
                  
                  async function load() {
                      const path = window.location.pathname;
                      // Remove .png if present for the HTML page logic
                      const cleanPath = path.replace(/\.png$/, '');
                      const parts = cleanPath.split('/').filter(p => p);
                      
                      if (parts.length < 3) {
                          document.getElementById('loading').style.display = 'none';
                          document.getElementById('result').innerHTML = `
                              <p style="text-align:center;padding:40px;">
                                  Use <code>/username/repo</code> for HTML or <code>/username/repo.png</code> for direct image
                              </p>
                          `;
                          return;
                      }
                      
                      const namespace = parts[1];
                      const project = parts[2];
                      const repoPath = `${namespace}/${project}`;
                      
                      try {
                          const projectUrl = `https://gitlab.com/api/v4/projects/${encodeURIComponent(repoPath)}`;
                          const projectRes = await fetch(projectUrl);
                          if (!projectRes.ok) throw new Error('Project not found: ' + repoPath);
                          
                          const projectData = await projectRes.json();
                          
                          const contribUrl = `https://gitlab.com/api/v4/projects/${projectData.id}/repository/contributors`;
                          const contribRes = await fetch(contribUrl);
                          if (!contribRes.ok) throw new Error('Failed to fetch contributors');
                          
                          const contributors = await contribRes.json();
                          
                          document.getElementById('loading').style.display = 'none';
                          
                          if (!contributors.length) {
                              document.getElementById('error').style.display = 'block';
                              document.getElementById('error').textContent = 'No contributors found';
                              return;
                          }
                          
                          const pngUrl = `/${parts[0]}/${repoPath}.png`;
                          
                          let html = `
                              <h2>${projectData.path_with_namespace}</h2>
                              <p>${contributors.length} contributors</p>
                              <a href="${pngUrl}" class="png-link" target="_blank">📥 Direct PNG Image</a>
                              <br>
                              <img src="${pngUrl}" style="max-width:100%;margin:20px 0;border-radius:10px;" alt="Contributors" onerror="this.style.display='none'">
                              <div class="contributors">
                          `;
                          
                          for (const c of contributors) {
                              const avatarUrl = await getGravatarUrl(c.email);
                              html += `
                                  <div class="contributor">
                                      <img src="${avatarUrl}" alt="${c.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23ddd%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2240%22>?</text></svg>'">
                                      <div><strong>${c.name || 'Unknown'}</strong></div>
                                      <div style="color:#666;">${c.commits} commits</div>
                                      <div style="color:#999;font-size:0.9em;">+${c.additions || 0} / -${c.deletions || 0}</div>
                                  </div>
                              `;
                          }
                          
                          html += '</div>';
                          document.getElementById('result').innerHTML = html;
                          
                      } catch (e) {
                          document.getElementById('loading').style.display = 'none';
                          document.getElementById('error').style.display = 'block';
                          document.getElementById('error').textContent = e.message;
                      }
                  }
                  
                  // Register service worker
                  if ('serviceWorker' in navigator) {
                      navigator.serviceWorker.register('/sw.js', { scope: '/' });
                  }
                  
                  load();
              </script>
          </body>
          </html>
          HTMLEOF

          # Index page
          cat > public/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>GitLab Contributors</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                  }
                  .container { text-align: center; color: white; padding: 20px; }
                  h1 { font-size: 3em; margin-bottom: 10px; }
                  p { margin-bottom: 20px; opacity: 0.9; }
                  code { background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 5px; }
                  a { color: white; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🎨 GitLab Contributors</h1>
                  <p>Dynamic contributor images for any GitLab repo</p>
                  <p>
                      <code>/username/repo.png</code> → PNG image<br>
                      <code>/username/repo</code> → HTML page
                  </p>
                  <p style="margin-top:20px;">
                      Try: <a href="/gitlabrocks/walfie308/lint.png">walfie308/lint.png</a>
                  </p>
                  <p style="margin-top:30px;font-size:0.8em;opacity:0.7;">
                      Register the service worker by visiting any page first
                  </p>
              </div>
          </body>
          </html>
          INDEXEOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
