name: Generate Contributors Images

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated list of repos (username/repo)'
        required: false
        default: 'walfie308/lint'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Generate contributor images
        env:
          REPO_LIST: ${{ github.event.inputs.repos || 'walfie308/lint' }}
        run: |
          python << 'PYEOF'
          import os
          import hashlib
          import requests
          from PIL import Image, ImageDraw
          from io import BytesIO
          import json
          from pathlib import Path

          def get_gravatar_url(email, size=80):
              if not email:
                  return f"https://www.gravatar.com/avatar/?d=identicon&s={size}"
              clean = email.lower().strip()
              # Create a hash for Gravatar-style identicon
              hash_val = hashlib.md5(clean.encode()).hexdigest()
              return f"https://www.gravatar.com/avatar/{hash_val}?d=identicon&s={size}"

          def create_contributors_png(contributors, output_path):
              avatar_size = 80
              padding = 4
              cols = min(10, len(contributors))
              rows = (len(contributors) + cols - 1) // cols
              
              img_width = cols * (avatar_size + padding) + padding
              img_height = rows * (avatar_size + padding) + padding
              
              # Create transparent image
              image = Image.new('RGBA', (img_width, img_height), (0, 0, 0, 0))
              
              for idx, contributor in enumerate(contributors):
                  email = contributor.get('email', '')
                  avatar_url = get_gravatar_url(email, avatar_size)
                  
                  try:
                      response = requests.get(avatar_url, timeout=10)
                      if response.status_code == 200:
                          avatar = Image.open(BytesIO(response.content))
                          avatar = avatar.resize((avatar_size, avatar_size), Image.Resampling.LANCZOS)
                          
                          # Create circular mask
                          mask = Image.new('L', (avatar_size, avatar_size), 0)
                          draw = ImageDraw.Draw(mask)
                          draw.ellipse((0, 0, avatar_size, avatar_size), fill=255)
                          
                          # Apply mask to avatar
                          avatar.putalpha(mask)
                          
                          col = idx % cols
                          row = idx // cols
                          x = padding + col * (avatar_size + padding)
                          y = padding + row * (avatar_size + padding)
                          
                          image.paste(avatar, (x, y), avatar)
                  except Exception as e:
                      print(f"Failed to load avatar for {contributor.get('name')}: {e}")
              
              # Ensure directory exists
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              image.save(output_path, 'PNG')
              print(f"Saved: {output_path} ({len(contributors)} contributors)")

          def process_repo(repo_path):
              print(f"\nProcessing: {repo_path}")
              
              try:
                  # Get project info
                  encoded = requests.utils.quote(repo_path, safe='')
                  project_url = f"https://gitlab.com/api/v4/projects/{encoded}"
                  project_response = requests.get(project_url, timeout=10)
                  
                  if project_response.status_code != 200:
                      print(f"Project not found: {repo_path}")
                      return
                  
                  project = project_response.json()
                  project_id = project['id']
                  
                  # Get contributors
                  contributors_url = f"https://gitlab.com/api/v4/projects/{project_id}/repository/contributors"
                  contributors_response = requests.get(contributors_url, timeout=10)
                  
                  if contributors_response.status_code != 200:
                      print(f"Failed to get contributors for {repo_path}")
                      return
                  
                  contributors = contributors_response.json()
                  
                  if not contributors:
                      print(f"No contributors for {repo_path}")
                      return
                  
                  # Generate PNG
                  png_path = f"public/{repo_path}.png"
                  create_contributors_png(contributors, png_path)
                  
                  # Also save JSON data
                  json_path = f"public/{repo_path}.json"
                  os.makedirs(os.path.dirname(json_path), exist_ok=True)
                  with open(json_path, 'w') as f:
                      json.dump(contributors, f, indent=2)
                  
                  # Create directory listing
                  dir_path = os.path.dirname(png_path)
                  index_path = f"public/{repo_path}/index.html"
                  os.makedirs(os.path.dirname(index_path), exist_ok=True)
                  
                  with open(index_path, 'w') as f:
                      f.write(f'''<!DOCTYPE html>
          <html>
          <head>
              <title>{repo_path} - Contributors</title>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                  body {{ font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }}
                  img {{ max-width: 100%; height: auto; }}
                  a {{ color: #666eea; }}
              </style>
          </head>
          <body>
              <h1>{repo_path}</h1>
              <p>{len(contributors)} contributors</p>
              <img src="../{repo_path.split('/')[-1]}.png" alt="Contributors">
              <br><br>
              <a href="../{repo_path.split('/')[-1]}.png">Direct image link</a> |
              <a href="../{repo_path.split('/')[-1]}.json">JSON data</a>
          </body>
          </html>''')
                  
              except Exception as e:
                  print(f"Error processing {repo_path}: {e}")

          # Get list of repos to process
          repo_list = os.environ.get('REPO_LIST', 'walfie308/lint')
          repos = [r.strip() for r in repo_list.split(',') if r.strip()]
          
          for repo in repos:
              process_repo(repo)
          
          print("\nDone generating all images!")
          PYEOF

      - name: Create index.html with proxy
        run: |
          cat > public/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>GitLab Contributors</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                  }
                  .container { text-align: center; color: white; padding: 20px; }
                  h1 { font-size: 3em; margin-bottom: 20px; }
                  input {
                      padding: 15px 20px; font-size: 1.2em; border: none;
                      border-radius: 10px; width: 300px; margin-right: 10px;
                  }
                  button {
                      padding: 15px 30px; font-size: 1.2em; background: white;
                      color: #667eea; border: none; border-radius: 10px;
                      cursor: pointer; font-weight: bold;
                  }
                  button:hover { background: #f0f0f0; }
                  .examples { margin-top: 30px; }
                  .examples a { color: white; margin: 0 10px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>GitLab Contributors</h1>
                  <p style="font-size: 1.2em; margin-bottom: 30px;">
                      Get contributor images for any GitLab repo
                  </p>
                  <div>
                      <input type="text" id="repoPath" placeholder="username/repository">
                      <button onclick="go()">View</button>
                  </div>
                  <div class="examples">
                      <p style="margin: 20px 0;">Usage:</p>
                      <code style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; display: inline-block;">
                          /username/repo.png
                      </code>
                      <p style="margin-top: 10px; opacity: 0.8;">Example: /walfie308/lint.png</p>
                  </div>
              </div>
              <script>
                  function go() {
                      const path = document.getElementById('repoPath').value.trim();
                      if (path) {
                          window.location.href = '/' + path + '.png';
                      }
                  }
                  document.getElementById('repoPath').addEventListener('keypress', function(e) {
                      if (e.key === 'Enter') go();
                  });
              </script>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
